name: PaperclipIOS
options:
  bundleIdPrefix: dev.tudu
  deploymentTarget:
    iOS: "17.0"
packages:
  PaperclipAPI:
    path: Packages/PaperclipAPI
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PaperclipIOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: PaperclipAPI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tudu.paperclip
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Paperclip
        INFOPLIST_KEY_NSCameraUsageDescription: "Take a photo to add to a comment."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach your latest screenshot to a comment."
  PaperclipIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: PaperclipIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.tudu.paperclip.tests
schemes:
  PaperclipIOS:
    build:
      targets:
        PaperclipIOS: all
    test:
      targets: [PaperclipIOSTests]
